<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Reservasi | KENA Nature Cabins</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      background: #f4f1e9;
      color: #183025;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      width: 100%;
      background: #173326;
      color: white;
      padding: 22px 25px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 28px;
      letter-spacing: 8px;
      white-space: nowrap;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 13px;
      white-space: nowrap;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 50px 22px;
    }

    .step {
      color: #9a7a4c;
      font-size: 12px;
      letter-spacing: 3px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    h1 {
      font-family: Georgia, serif;
      font-weight: normal;
      font-size: 46px;
      line-height: 1.08;
      color: #183025;
      margin-bottom: 18px;
    }

    .subtitle {
      color: #68756e;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    /* =========================
       BOOKING CARD
    ========================= */

    .booking-card {
      width: 100%;
      background: white;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }

    .dates {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .date-field {
      width: 100%;
      min-width: 0;
    }

    label {
      display: block;
      color: #183025;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1.5px;
      margin-bottom: 9px;
    }

    /* =========================
       INPUT TANGGAL
    ========================= */

    input[type="date"] {
      display: block;

      width: 100%;
      max-width: 100%;
      min-width: 0;

      height: 58px;
      min-height: 58px;

      padding: 0 16px;

      border: 1px solid #d7d7d0;
      border-radius: 12px;

      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: normal;

      color: #183025;
      background: #fafaf7;

      outline: none;

      -webkit-appearance: none;
      appearance: none;
    }

    input[type="date"]:focus {
      border-color: #173326;
      background: white;
    }

    /* Chrome / Safari / browser HP */

    input[type="date"]::-webkit-date-and-time-value {
      display: flex;
      align-items: center;

      height: 56px;
      min-height: 56px;

      padding: 0;
      margin: 0;

      text-align: left;
    }

    input[type="date"]::-webkit-datetime-edit {
      display: flex;
      align-items: center;

      height: 56px;

      padding: 0;
      margin: 0;
    }

    input[type="date"]::-webkit-datetime-edit-fields-wrapper {
      display: flex;
      align-items: center;

      height: 56px;

      padding: 0;
      margin: 0;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      flex-shrink: 0;

      width: 22px;
      height: 22px;

      margin: 0;
      padding: 4px;

      cursor: pointer;
    }

    /* =========================
       SUMMARY
    ========================= */

    .summary {
      width: 100%;

      margin-top: 25px;
      padding-top: 22px;

      border-top: 1px solid #e6e3dc;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 15px;

      font-size: 14px;
    }

    .summary span {
      display: block;
    }

    /* =========================
       BUTTON
    ========================= */

    button {
      display: block;

      width: 100%;

      margin-top: 28px;

      border: none;
      border-radius: 50px;

      background: #173326;
      color: white;

      padding: 18px 20px;

      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    button:hover {
      background: #234a38;
    }

    button:active {
      transform: scale(0.98);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 18px 20px;
      }

      .logo {
        font-size: 25px;
        letter-spacing: 7px;
      }

      .back {
        font-size: 11px;
      }

      main {
        width: 100%;
        padding: 34px 18px 45px;
      }

      .step {
        font-size: 11px;
        letter-spacing: 2.5px;
        margin-bottom: 14px;
      }

      h1 {
        font-size: 38px;
        line-height: 1.08;
        margin-bottom: 18px;
      }

      .subtitle {
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 28px;
      }

      .booking-card {
        width: 100%;
        padding: 22px;
        border-radius: 20px;
      }

      .dates {
        display: grid;
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .summary {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;

        margin-top: 25px;
        padding-top: 22px;
      }

      button {
        margin-top: 25px;
        min-height: 56px;
      }
    }

    /* =========================
       HP KECIL
    ========================= */

    @media (max-width: 380px) {

      header {
        padding: 16px;
      }

      .logo {
        font-size: 22px;
        letter-spacing: 6px;
      }

      main {
        padding: 28px 14px 40px;
      }

      h1 {
        font-size: 34px;
      }

      .booking-card {
        padding: 18px;
      }

      input[type="date"] {
        font-size: 15px;
        padding-left: 13px;
        padding-right: 13px;
      }

      button {
        font-size: 12px;
        letter-spacing: 0.8px;
      }
    }
  </style>
</head>


<body>

  <header>

    <div class="logo">
      KENA
    </div>

    <a class="back" href="index.html">
      ← BERANDA
    </a>

  </header>


  <main>

    <div class="step">
      LANGKAH 01 · RENCANA MENGINAP
    </div>


    <h1>
      Kapan Anda akan menginap?
    </h1>


    <p class="subtitle">
      Pilih tanggal check-in dan check-out untuk melihat kabin yang tersedia.
    </p>


    <div class="booking-card">

      <div class="dates">

        <div class="date-field">

          <label for="checkin">
            CHECK-IN
          </label>

          <input
            type="date"
            id="checkin"
            name="checkin"
          >

        </div>


        <div class="date-field">

          <label for="checkout">
            CHECK-OUT
          </label>

          <input
            type="date"
            id="checkout"
            name="checkout"
          >

        </div>

      </div>


      <div class="summary">

        <span>
          🌲 Baturraden
        </span>

        <span>
          👤 2 Tamu
        </span>

        <span>
          🏡 Kabin Deluxe
        </span>

      </div>


      <button
        type="button"
        onclick="continueBooking()"
      >
        CEK KETERSEDIAAN →
      </button>

    </div>

  </main>


  <script>

    /* =========================
       TANGGAL MINIMUM
    ========================= */

    const todayDate = new Date();

    const year =
      todayDate.getFullYear();

    const month =
      String(todayDate.getMonth() + 1)
        .padStart(2, "0");

    const day =
      String(todayDate.getDate())
        .padStart(2, "0");

    const today =
      `${year}-${month}-${day}`;


    const checkinInput =
      document.getElementById("checkin");

    const checkoutInput =
      document.getElementById("checkout");


    checkinInput.min = today;

    checkoutInput.min = today;


    /* =========================
       SAAT CHECK-IN DIPILIH
    ========================= */

    checkinInput.addEventListener(
      "change",
      function () {

        if (!this.value) {
          return;
        }


        const selectedDate =
          new Date(this.value + "T00:00:00");


        selectedDate.setDate(
          selectedDate.getDate() + 1
        );


        const nextYear =
          selectedDate.getFullYear();

        const nextMonth =
          String(
            selectedDate.getMonth() + 1
          ).padStart(2, "0");

        const nextDay =
          String(
            selectedDate.getDate()
          ).padStart(2, "0");


        const minimumCheckout =
          `${nextYear}-${nextMonth}-${nextDay}`;


        checkoutInput.min =
          minimumCheckout;


        if (
          checkoutInput.value &&
          checkoutInput.value <= this.value
        ) {

          checkoutInput.value = "";

        }

      }
    );


    /* =========================
       LANJUT KE CABINS
    ========================= */

    function continueBooking() {

      const checkin =
        checkinInput.value;

      const checkout =
        checkoutInput.value;


      if (!checkin || !checkout) {

        alert(
          "Silakan pilih tanggal check-in dan check-out."
        );

        return;

      }


      if (checkout <= checkin) {

        alert(
          "Tanggal check-out harus setelah tanggal check-in."
        );

        return;

      }


      localStorage.setItem(
        "kenaCheckin",
        checkin
      );


      localStorage.setItem(
        "kenaCheckout",
        checkout
      );


      window.location.href =
        "cabins.html";

    }

  </script>

</body>
</html>
